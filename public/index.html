<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>STIHL Digital Book Builder</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" href="fonts/contraface-text.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<header class="hd"><div class="wrap top">
  <a href="#/" class="home" aria-label="Tableau de bord"><img class="logo" src="template/logo.png" alt="STIHL" width="92" height="40"></a>
  <div class="t"><b>Digital Book Builder</b><span id="mode"></span></div>
  <nav class="nav" aria-label="Navigation">
    <a href="#/" data-nav="dash">Tableau de bord</a>
    <a href="#/books" data-nav="books">Books</a>
    <a href="#/shared" data-nav="shared">Blocs partagés</a>
  </nav>
</div></header>

<main id="main" class="wrap">
  <section id="login" class="card" hidden>
    <h1>Connexion</h1>
    <form id="loginForm">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Se connecter</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </section>
  <div id="view"></div>
</main>
<dialog id="dlg" aria-labelledby="dlgTitle"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/app.js?v=5"></script>
</body>
</html>
